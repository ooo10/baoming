<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 - AI应用教学开放日</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-container">
    <!-- 顶部导航 -->
    <div class="admin-header">
      <h1>AI应用教学开放日 · 管理后台</h1>
      <button class="btn btn-secondary" onclick="logout()">退出登录</button>
    </div>

    <!-- 标签切换 -->
    <div class="tabs">
      <button class="tab active" data-tab="data">数据管理</button>
      <button class="tab" data-tab="settings">活动设置</button>
    </div>

    <!-- 数据管理 -->
    <div class="tab-content active" id="tab-data">
      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="form-group">
          <label>搜索：</label>
          <input type="text" id="searchInput" class="form-control" placeholder="姓名 / 手机号" />
        </div>
        <div class="form-group">
          <label>身份：</label>
          <select id="identityFilter" class="form-control">
            <option value="">全部</option>
            <option value="教师">教师</option>
            <option value="学生">学生</option>
          </select>
        </div>
        <div class="form-group">
          <label>开始：</label>
          <input type="date" id="startDate" class="form-control" />
        </div>
        <div class="form-group">
          <label>结束：</label>
          <input type="date" id="endDate" class="form-control" />
        </div>
        <div class="filter-actions">
          <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
          <button class="btn btn-primary" onclick="searchData()">搜索</button>
        </div>
      </div>

      <!-- 导出按钮 -->
      <div style="margin-bottom: 12px; display: flex; gap: 8px;">
        <button class="btn btn-primary" onclick="exportData('csv')">导出 CSV</button>
        <button class="btn btn-primary" onclick="exportData('excel')">导出 Excel</button>
        <span id="totalCount" style="align-self: center; color: var(--text-secondary); font-size: 14px;"></span>
      </div>

      <!-- 数据表格 -->
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>姓名</th>
              <th>身份</th>
              <th>院系</th>
              <th>手机号</th>
              <th>参加场次</th>
              <th>备注</th>
              <th>报名时间</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">
          暂无报名数据
        </div>
      </div>

      <!-- 分页 -->
      <div class="pagination">
        <span id="pageInfo"></span>
        <div class="page-buttons" id="pageButtons"></div>
      </div>
    </div>

    <!-- 活动设置 -->
    <div class="tab-content" id="tab-settings">
      <div class="card">
        <h3 style="margin-bottom: 20px; color: var(--primary);">报名截止时间设置</h3>
        <div class="form-group">
          <label for="deadline">报名截止时间</label>
          <input type="datetime-local" id="deadline" class="form-control" />
        </div>
        <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;">
          到达截止时间后，报名入口将自动关闭。
        </p>
        <button class="btn btn-primary" onclick="saveDeadline()">保存设置</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    // 登录校验
    if (sessionStorage.getItem("adminLoggedIn") !== "true") {
      location.href = "admin-login.html";
    }

    const PAGE_SIZE = 20;
    let currentPage = 1;
    let filteredData = [];

    // 初始化
    function init() {
      loadDeadline();
      applyFilter();
    }

    // 加载截止时间
    function loadDeadline() {
      const deadline = getDeadline();
      document.getElementById("deadline").value = deadline;
    }

    // 保存截止时间
    function saveDeadline() {
      const val = document.getElementById("deadline").value;
      if (!val) {
        showToast("请选择截止时间", "error");
        return;
      }
      if (new Date(val) <= new Date()) {
        showToast("截止时间不能早于当前时间", "error");
        return;
      }
      setDeadline(val);
      showToast("设置成功", "success");
    }

    // 退出登录
    function logout() {
      sessionStorage.removeItem("adminLoggedIn");
      location.href = "admin-login.html";
    }

    // 标签切换
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", function () {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
        this.classList.add("active");
        document.getElementById("tab-" + this.dataset.tab).classList.add("active");
      });
    });

    // 筛选
    function applyFilter() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const identity = document.getElementById("identityFilter").value;
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;

      filteredData = getRegistrations().filter((item) => {
        if (keyword) {
          const match =
            item.name.toLowerCase().includes(keyword) ||
            item.phone.includes(keyword);
          if (!match) return false;
        }
        if (identity && item.identity !== identity) return false;
        const regDate = new Date(item.registerTime);
        if (startDate && regDate < new Date(startDate + "T00:00:00")) return false;
        if (endDate && regDate > new Date(endDate + "T23:59:59")) return false;
        return true;
      });

      currentPage = 1;
      renderTable();
    }

    function searchData() {
      applyFilter();
    }

    function resetFilter() {
      document.getElementById("searchInput").value = "";
      document.getElementById("identityFilter").value = "";
      document.getElementById("startDate").value = "";
      document.getElementById("endDate").value = "";
      applyFilter();
    }

    // 渲染表格
    function renderTable() {
      const tbody = document.getElementById("tableBody");
      const empty = document.getElementById("emptyState");
      const total = filteredData.length;

      document.getElementById("totalCount").textContent = `共 ${total} 条记录`;

      if (total === 0) {
        tbody.innerHTML = "";
        empty.style.display = "block";
        document.getElementById("pageInfo").textContent = "";
        document.getElementById("pageButtons").innerHTML = "";
        return;
      }

      empty.style.display = "none";

      const start = (currentPage - 1) * PAGE_SIZE;
      const end = Math.min(start + PAGE_SIZE, total);
      const pageData = filteredData.slice(start, end);

      tbody.innerHTML = pageData
        .map(
          (item) => `
        <tr>
          <td>${escapeHtml(item.name)}</td>
          <td>${item.identity || "-"}</td>
          <td>${escapeHtml(item.department || "-")}</td>
          <td>${maskPhone(item.phone)}</td>
          <td>${escapeHtml(item.session || "-")}</td>
          <td>${escapeHtml(item.remark || "-")}</td>
          <td>${formatDateTime(item.registerTime)}</td>
        </tr>
      `
        )
        .join("");

      renderPagination(total);
    }

    // 分页
    function renderPagination(total) {
      const totalPages = Math.ceil(total / PAGE_SIZE);
      document.getElementById("pageInfo").textContent = `第 ${currentPage} / ${totalPages} 页`;

      const btns = document.getElementById("pageButtons");
      let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? "disabled" : ""}>上一页</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? "active" : ""}" onclick="goPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? "disabled" : ""}>下一页</button>`;
      btns.innerHTML = html;
    }

    function goPage(p) {
      const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderTable();
    }

    // 导出
    function exportData(format) {
      const data = filteredData;
      if (data.length === 0) {
        showToast("暂无报名数据可导出", "error");
        return;
      }

      const headers = ["姓名", "身份", "院系", "手机号", "参加场次", "备注", "报名时间"];
      const rows = data.map((item) => [
        item.name,
        item.identity || "",
        item.department || "",
        item.phone,
        item.session || "",
        item.remark || "",
        formatDateTime(item.registerTime),
      ]);

      const filename = `开放日报名数据_${new Date().toISOString().slice(0, 10).replace(/-/g, "")}`;

      if (format === "csv") {
        const csv = [headers, ...rows]
          .map((row) => row.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","))
          .join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        downloadBlob(blob, filename + ".csv");
      } else {
        const tableHtml = `<table border="1"><thead><tr>${headers
          .map((h) => `<th>${h}</th>`)
          .join("")}</tr></thead><tbody>${rows
          .map(
            (r) =>
              `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`
          )
          .join("")}</tbody></table>`;
        const blob = new Blob(
          ['\uFEFF<html><head><meta charset="utf-8"></head><body>' + tableHtml + "</body></html>"],
          { type: "application/vnd.ms-excel;charset=utf-8;" }
        );
        downloadBlob(blob, filename + ".xls");
      }

      showToast("导出成功", "success");
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
