<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员登录 - AI应用教学开放日</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2>管理员登录</h2>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">账号</label>
          <input type="text" id="username" class="form-control" placeholder="请输入账号" />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" class="form-control" placeholder="请输入密码" />
        </div>
        <div id="loginErr" class="error-text" style="text-align: center; margin-bottom: 12px;">
          账号或密码错误
        </div>
        <button type="submit" class="btn btn-primary btn-full">登 录</button>
      </form>
      <p style="text-align: center; margin-top: 16px; color: var(--text-secondary); font-size: 13px;">
        默认账号：admin / 密码：123456
      </p>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    if (sessionStorage.getItem("adminLoggedIn") === "true") {
      location.href = "admin.html";
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errEl = document.getElementById("loginErr");

      if (!username || !password) {
        errEl.textContent = "请输入账号和密码";
        errEl.classList.add("show");
        return;
      }

      if (username === "admin" && password === "123456") {
        sessionStorage.setItem("adminLoggedIn", "true");
        location.href = "admin.html";
      } else {
        errEl.textContent = "账号或密码错误";
        errEl.classList.add("show");
      }
    });
  </script>
</body>
</html>
